# .github/workflows/ci.yml
# ────────────────────────────────────────────────────────────
# GitHub Actions CI 工作流
# 触发：push/PR/手动/定时
# 能力：并行、Allure报告、失败截图制品、阻断合并
# ────────────────────────────────────────────────────────────

name: UI+API Automation CI

# ═══════════════════════════════════════════════════════════
# 触发条件
# ═══════════════════════════════════════════════════════════
on:
  push:
    branches: [main, master] # 推到主分支触发
  pull_request:
    branches: [main, master] # 提 PR 触发
  workflow_dispatch: # 手动点击触发（GitHub 网页端）
  schedule: # 定时触发（UTC 时间）
    - cron: "0 2 * * *" # 每天 UTC 02:00（北京时间 10:00）跑回归

# ═══════════════════════════════════════════════════════════
# 环境变量
# ═══════════════════════════════════════════════════════════
env:
  PYTHON_VERSION: "3.11"
  # CI 的 Linux 运行器没有显示器，必须用无头模式跑浏览器
  HEADLESS: "true"

# ═══════════════════════════════════════════════════════════
# Job 定义
# ═══════════════════════════════════════════════════════════
jobs:
  test:
    name: Run Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # 权限：允许写入仓库内容（推送 gh-pages 分支部署 Pages）
    permissions:
      contents: write
      pages: write
      id-token: write
    # 矩阵策略：多 OS/多 Python 版本并行
    strategy:
      matrix:
        os: [ubuntu-latest] # 可加 windows-latest, macos-latest
        python: ["3.11"]
      fail-fast: false # 一个矩阵失败不取消其他

    steps:
      # ─── 1. 检出代码 ───
      - name: Checkout code
        uses: actions/checkout@v4

      # ─── 2. 设置 Python + 缓存 pip ───
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip" # 缓存 ~/.cache/pip，下次装依赖极快

      # ─── 3. 安装依赖 ───
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium  # 装浏览器+系统依赖

      # ─── 4. 运行测试（并行、生成 Allure 结果）───
      - name: Run tests
        run: |
          mkdir -p allure-results reports
          # -n 2：2 进程并行
          # --alluredir：输出 Allure 原始结果
          # --clean-alluredir：先清空旧结果
          pytest tests/ -n 2 --alluredir=allure-results --clean-alluredir -q

      # ─── 5. 上传 Allure 结果（作为 Artifact）───
      - name: Upload Allure results
        if: always() # 无论成功失败都上传
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.os }}
          path: allure-results/
          retention-days: 7 # 保留 7 天

      # ─── 6. 上传失败截图/视频 ───
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.os }}
          path: reports/
          retention-days: 7

      # ─── 7. 生成 Allure 报告（用 npm 安装 allure 命令行，apt 源里没有 allure 包）───
      - name: Generate Allure Report
        if: always()
        run: |
          npm install -g allure-commandline
          allure generate allure-results -o allure-report --clean

      # ─── 8. 上传 Allure 报告制品（可下载查看）───
      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-${{ matrix.os }}
          path: allure-report/
          retention-days: 7

      # ─── 9. 部署到 GitHub Pages（可选，需仓库开启 Pages）───
      - name: Deploy to GitHub Pages
        if: always() && github.ref == 'refs/heads/main' && github.repository_owner == 'wdenylily'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
          publish_branch: gh-pages

  # ═══════════════════════════════════════════════════════════
  # 可选：仅跑接口测试（快，适合 PR 快速检查）
  # ═══════════════════════════════════════════════════════════
  api-test:
    name: API Tests Only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: "pip" }
      - run: pip install -r requirements.txt
      - run: pytest tests/test_api_login.py -v
