# .github/workflows/ci.yml
# ────────────────────────────────────────────────────────────
# GitHub Actions CI 工作流
# 触发：push/PR/手动/定时
# 能力：并行、Allure报告、失败截图制品、阻断合并
# ────────────────────────────────────────────────────────────

name: UI+API Automation CI

# ═══════════════════════════════════════════════════════════
# 触发条件
# ═══════════════════════════════════════════════════════════
on:
  push:
    branches: [main, master] # 推到主分支触发
  pull_request:
    branches: [main, master] # 提 PR 触发
  workflow_dispatch: # 手动点击触发（GitHub 网页端）
  schedule: # 定时触发（UTC 时间）
    - cron: "0 2 * * *" # 每天 UTC 02:00（北京时间 10:00）跑回归

# ═══════════════════════════════════════════════════════════
# 环境变量
# ═══════════════════════════════════════════════════════════
env:
  PYTHON_VERSION: "3.11"
  # CI 的 Linux 运行器没有显示器，必须用无头模式跑浏览器
  HEADLESS: "true"

# ═══════════════════════════════════════════════════════════
# Job 定义
# ═══════════════════════════════════════════════════════════
jobs:
  test:
    name: Run Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # 权限：允许写入仓库内容（推送 gh-pages 分支部署 Pages）
    permissions:
      contents: write
      pages: write
      id-token: write
    # 矩阵策略：多 OS/多 Python 版本并行
    strategy:
      matrix:
        os: [ubuntu-latest] # 可加 windows-latest, macos-latest
        python: ["3.11"]
      fail-fast: false # 一个矩阵失败不取消其他

    steps:
      # ─── 1. 检出代码 ───
      - name: Checkout code
        uses: actions/checkout@v4

      # ─── 2. 设置 Python + 缓存 pip ───
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip" # 缓存 ~/.cache/pip，下次装依赖极快

      # ─── 3. 安装 Python 依赖（只装包，不装浏览器）───
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # 打印安装的 playwright 版本，便于排查版本不匹配
          python -c "import playwright; print('playwright version:', playwright.__version__ if hasattr(playwright, '__version__') else 'unknown')"

      - name: Install Playwright browsers
        run: |
          set -euo pipefail
          python -m playwright install --with-deps

      - name: Verify Playwright install
        run: |
          set -euo pipefail
          python -c "import playwright; print('playwright:', getattr(playwright,'__version__','unknown'))"
          echo "ms-playwright cache:"
          ls -la "$HOME/.cache/ms-playwright" || true
          echo "find chrome-headless-shell:"
          path=$(find "$HOME/.cache/ms-playwright" -type f -name 'chrome-headless-shell*' | head -n 1 || true)
          echo "headless shell path: $path"
          test -n "$path"
          test -x "$path"
          echo "OK: headless shell exists and is executable"

      # ─── 6. 运行测试（并行、生成 Allure 结果）───
      - name: Run tests
        run: |
          mkdir -p allure-results reports
          # -n 2：2 进程并行
          # --alluredir：输出 Allure 原始结果
          # --clean-alluredir：先清空旧结果
          pytest tests/ -n 2 --alluredir=allure-results --clean-alluredir -q

      # ─── 7. 上传 Allure 结果（作为 Artifact）───
      - name: Upload Allure results
        if: always() # 无论成功失败都上传
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.os }}
          path: allure-results/
          retention-days: 7 # 保留 7 天

      # ─── 8. 清洗截图文件名（actions/upload-artifact v4 不允许 : " < > | * ? \r \n）───
      - name: Sanitize screenshot filenames
        if: always()
        run: |
          find reports/ -type f -print0 | while IFS= read -r -d '' f; do
            dir=$(dirname "$f")
            base=$(basename "$f")
            # 替换所有 artifact 不允许的字符为下划线
            clean=$(echo "$base" | sed 's/[:<>|*?"'\'']/_/g')
            if [ "$base" != "$clean" ]; then
              mv "$f" "$dir/$clean" 2>/dev/null || true
            fi
          done
        shell: bash

      # ─── 9. 上传失败截图/视频 ───
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.os }}
          path: reports/
          retention-days: 7

      # ─── 10. 生成 Allure 报告（用 npm 安装 allure 命令行，apt 源里没有 allure 包）───
      - name: Generate Allure Report
        if: always()
        run: |
          npm install -g allure-commandline
          allure generate allure-results -o allure-report --clean

      # ─── 11. 上传 Allure 报告制品（可下载查看）───
      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-${{ matrix.os }}
          path: allure-report/
          retention-days: 7

      # ─── 12. 部署到 GitHub Pages（可选，需仓库开启 Pages）───
      - name: Deploy to GitHub Pages
        if: always() && github.ref == 'refs/heads/main' && github.repository_owner == 'wdenylily'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
          publish_branch: gh-pages

  # ═══════════════════════════════════════════════════════════
  # 可选：仅跑接口测试（快，适合 PR 快速检查）
  # ═══════════════════════════════════════════════════════════
  api-test:
    name: API Tests Only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: "pip" }
      - run: pip install -r requirements.txt
      - run: pytest tests/test_api_login.py -v
