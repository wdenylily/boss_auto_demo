# config/env.yaml：这是当前项目的环境配置文件路径说明；文件名 env 通常表示 environment（运行环境）。
# 所有"变化的东西"集中在这里：把网址、浏览器和测试账号等容易变化的参数集中管理，测试代码就不必写死这些值。

base_url: "https://www.saucedemo.com" # base_url 是键名，表示测试要访问的网站根地址；冒号后面的字符串是它的配置值。
browser: "chromium" # browser 表示使用哪一种浏览器；chromium 是浏览器内核名称，另外也可配置 firefox 或 webkit。
headless: false # headless 表示是否以无头模式运行；false 会显示浏览器窗口，CI（持续集成）环境通常改为 true 以便后台运行。
slow_mo: 0 # slow_mo 表示每个浏览器操作额外延迟的毫秒数；0 表示不延迟，调试时可设为 500 让操作变慢、便于观察。

users: # users 是一个对象（映射），用于按用途分组保存多个测试用户账号。
  standard: # standard 是普通用户这组配置的名称，测试代码可通过 users.standard 取得它。
    username: "standard_user" # username 是登录用户名字段；这里使用 SauceDemo 提供的标准测试账号。
    password: "secret_sauce" # password 是登录密码字段；冒号后的值会作为该账号的密码传入登录步骤。
  locked: # locked 是被锁定用户这组配置的名称，用于验证登录失败等异常场景。
    username: "locked_out_user" # 这是 SauceDemo 提供的已锁定账号用户名，预期登录时会显示错误提示。
    password: "secret_sauce" # 这是该测试账号对应的密码。
  problem: # problem 是问题用户这组配置的名称，用于验证页面行为异常或特殊数据场景。
    username: "problem_user" # 这是 SauceDemo 提供的问题用户用户名。
    password: "secret_sauce" # 这是该测试账号对应的密码。
